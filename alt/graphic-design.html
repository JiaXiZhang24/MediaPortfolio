      <p class="alt-page-index">03 / GRAPHIC DESIGN <span>—</span> SELECTED WORK</p>

      <section class="zine-experience" aria-labelledby="zine-title">
        <div class="zine-heading">
          <p class="zine-heading__eyebrow">Zine</p>
          <h1 id="zine-title">5 Eras of Pablo Picasso<span class="alt-red-period">.</span></h1>
          <p class="zine-heading__year">2020</p>
        </div>

        <img
          class="fragment fragment--top-left"
          src="assets/graphic-design/fragment-top-left.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="fragment fragment--mid-left"
          src="assets/graphic-design/fragment-mid-left.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="fragment fragment--bottom-left"
          src="assets/graphic-design/fragment-bottom-left.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="fragment fragment--top-right"
          src="assets/graphic-design/fragment-top-right.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="fragment fragment--bottom-right"
          src="assets/graphic-design/fragment-bottom-right.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="fragment fragment--upper-middle"
          src="assets/graphic-design/fragment-bottom-left.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="fragment fragment--middle-right"
          src="assets/graphic-design/fragment-mid-left.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="fragment fragment--lower-middle"
          src="assets/graphic-design/fragment-bottom-right.png"
          alt=""
          aria-hidden="true"
        />

        <div class="book-stage" id="bookStage">
          <img
            class="book-fallback"
            src="assets/zine/cover.jpg"
            alt="Pablo Picasso zine cover"
          />
          <canvas id="bookCanvas" aria-label="Interactive Pablo Picasso zine"></canvas>
          <button class="page-hit page-hit--left" id="previousPage" type="button">
            <span class="sr-only">Turn to the previous spread</span>
          </button>
          <button class="page-hit page-hit--right" id="nextPage" type="button">
            <span class="sr-only">Turn to the next spread</span>
          </button>
          <p class="page-status sr-only" id="pageStatus" aria-live="polite">Cover</p>
        </div>

      </section>
